<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robot</title>
<style>
  /* 9:16 şaquli kadr (TikTok). OBS-də 1080x1920 ölçüsü verilir. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* Səhnə: fon şəkli (572x1024 nisbəti) + üstündə 3D robot */
  #stage { position: absolute; left: 50%; top: 50%; aspect-ratio: 572 / 1024;
    width: max(100vw, calc(100vh * 572 / 1024)); transform: translate(-50%, -50%); }
  #camera { position: absolute; inset: 0; animation: drift 17s ease-in-out infinite; }
  [hidden] { display: none !important; }
  /* Hərəkət videosu (rəqs və s.): fotonun üstündə, eyni kadrda */
  #action { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0; transition: opacity 180ms linear; pointer-events: none; }
  #action.show { opacity: 1; }
  /* Hərəkət videosu oynayanda yazılar robotu örtməsin (ayağa qalxanda baş yuxarı çıxır) */
  body.acting #comment, body.acting #subtitle { opacity: 0 !important; }
  #room, #robot3d, #android { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Ştativdəki telefonun çox yüngül "nəfəs alması" */
  @keyframes drift {
    0%   { transform: scale(1.03) translate(0, 0) rotate(0deg); }
    25%  { transform: scale(1.032) translate(-0.25%, 0.15%) rotate(-0.08deg); }
    50%  { transform: scale(1.03) translate(0.2%, -0.1%) rotate(0.06deg); }
    75%  { transform: scale(1.033) translate(-0.1%, -0.2%) rotate(0deg); }
    100% { transform: scale(1.03) translate(0, 0) rotate(0deg); }
  }

  /* Lampa işığının zəif titrəməsi */
  #lamp { position: absolute; left: -5%; top: 22%; width: 32%; height: 22%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse, rgba(255,210,150,.35), rgba(255,180,90,0) 70%); mix-blend-mode: screen; }

  /* Fincandan qalxan buxar */
  .steam { position: absolute; left: 15.5%; top: 70%; width: 4%; height: 8%; pointer-events: none; }
  .steam i { position: absolute; bottom: 0; left: 20%; width: 60%; height: 40%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.3), rgba(255,255,255,0) 70%);
    filter: blur(3px); opacity: 0; animation: rise 4.5s ease-out infinite; }
  .steam i:nth-child(2) { animation-delay: 1.5s; left: 5%; }
  .steam i:nth-child(3) { animation-delay: 3s; left: 35%; }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    20%  { opacity: .5; }
    100% { transform: translateY(-160%) scale(1.6) translateX(30%); opacity: 0; }
  }

  #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .07; mix-blend-mode: overlay; pointer-events: none; image-rendering: pixelated; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }

  /* İzləyicinin şərhi */
  #comment { position: absolute; left: 4%; right: 4%; top: 6%; padding: 1.8vh 2.6vh; border-radius: 2vh;
    background: rgba(0,0,0,.5); backdrop-filter: blur(6px); color: #fff; font-size: 2.4vh;
    opacity: 0; transform: translateY(-1vh); transition: opacity 200ms, transform 200ms; }
  #comment.show { opacity: 1; transform: none; }
  #comment b { color: #ffd33d; }

  /* Robotun cavabı (subtitr) */
  #subtitle { position: absolute; left: 6%; right: 6%; bottom: 13%; text-align: center; color: #fff;
    font-size: 3.8vh; font-weight: 800; line-height: 1.25;
    text-shadow: 0 0.3vh 0.8vh #000, 0 0 0.3vh #000; opacity: 0; transition: opacity 150ms; }
  #subtitle.show { opacity: 1; }

  /* Adi brauzerdə səs üçün bir dəfə klik lazımdır (OBS-də lazım deyil) */
  #unlock { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6);
    color: #fff; font-size: 3vh; cursor: pointer; }
  #unlock.show { display: grid; }

  #status { position: absolute; right: 8px; bottom: 8px; width: 10px; height: 10px; border-radius: 50%; background: #da3633; }
  #status.ok { display: none; } /* yalnız bağlantı kəsiləndə (qırmızı) görünür */
</style>
<script type="importmap">
  { "imports": { "three": "/static/vendor/three.module.min.js", "three/addons/": "/static/vendor/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <div id="camera">
    <img id="room" src="/static/assets/room_bg.jpg" alt="" hidden>
    <canvas id="android"></canvas>
    <canvas id="robot3d" hidden></canvas>
    <video id="action" playsinline preload="auto"></video>
    <div id="lamp"></div>
    <div class="steam"><i></i><i></i><i></i></div>
  </div>
  <canvas id="grain" width="180" height="320"></canvas>
  <div id="vignette"></div>
</div>

<div id="comment"></div>
<div id="subtitle"></div>
<div id="unlock">🔊 Səsi aktivləşdirmək üçün klikləyin</div>
<div id="status" title="Serverə qoşulma"></div>

<script type="module">
  // Varsayılan: insan üzlü android (danışan foto). ?mode=3d -> 3D robot
  const stage = document.getElementById("stage");
  if (new URLSearchParams(location.search).get("mode") === "3d") {
    document.getElementById("android").hidden = true;
    document.getElementById("room").hidden = false;
    document.getElementById("robot3d").hidden = false;
    const { startRobot } = await import("/static/robot3d.js");
    startRobot(document.getElementById("robot3d"), stage);
  } else {
    const { startAndroid } = await import("/static/android.js");
    await startAndroid(document.getElementById("android"), stage);
  }
</script>

<script>
  const commentEl = document.getElementById("comment");
  const subtitleEl = document.getElementById("subtitle");
  const statusEl = document.getElementById("status");
  const unlockEl = document.getElementById("unlock");
  const robot = () => window.robot; // 3D modul yüklənəndən sonra mövcud olur

  // Səsi açmağa çalışır, amma ən çox 600 ms gözləyir (klik olmayanda brauzer resume()-ni sonsuz saxlayır)
  async function tryResume() {
    initAudio();
    if (actx.state === "running") return true;
    await Promise.race([actx.resume().catch(() => {}), new Promise((r) => setTimeout(r, 600))]);
    return actx.state === "running";
  }

  // ---------- Səs + analiz (robotun ağzı və başı bundan istifadə edir) ----------
  const audio = new Audio();
  let actx, analyser, freq, recDest;
  window.robotAudio = { level: 0, bands: [], speaking: false };
  const BAND_COUNT = 17;

  function initAudio() {
    if (actx) return;
    actx = new AudioContext();
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    analyser.connect(actx.destination);
    recDest = actx.createMediaStreamDestination(); // video yazısı üçün səs
    analyser.connect(recDest);
    freq = new Uint8Array(analyser.frequencyBinCount);
  }

  // Ehtiyat: bəzi brauzerlərdə (Safari, telefon) səs çalınır, amma analiz sıfır qaytarır.
  // Onda ağız danışıq ritmində (hecalarla) süni hərəkət edir.
  let level = 0, silentSince = 0, heard = false, synth = { phase: 0, rate: 5.5, amp: 0.7 }, lastT = performance.now();
  function synthLevel(dt) {
    const prev = synth.phase;
    synth.phase += dt * synth.rate;
    if (Math.floor(synth.phase) !== Math.floor(prev)) { // yeni heca
      synth.rate = 4.5 + Math.random() * 2;
      synth.amp = Math.random() < 0.15 ? 0.05 : 0.45 + Math.random() * 0.45; // arabir söz arası fasilə
    }
    return synth.amp * Math.max(0, Math.sin((synth.phase % 1) * Math.PI));
  }

  function analyse(now) {
    const A = window.robotAudio;
    const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
    if (!audio.paused && currentId) A.speaking = true; // "playing" hadisəsi gəlməsə belə
    let target = 0;
    const bands = new Array(BAND_COUNT).fill(0);
    if (A.speaking) {
      let sum = 0;
      if (analyser) {
        analyser.getByteFrequencyData(freq);
        for (let i = 2; i < 48; i++) sum += freq[i]; // danışıq tezlikləri
      }
      if (sum > 0) {
        silentSince = 0;
        heard = true; // analiz işləyir
        target = Math.min(1, (sum / 46) / 150);
        for (let b = 0; b < BAND_COUNT; b++) {
          const center = Math.abs(b - (BAND_COUNT - 1) / 2) / ((BAND_COUNT - 1) / 2);
          bands[b] = Math.min(1, freq[3 + Math.floor(center * 30)] / 210) * (1 - center * 0.45);
        }
      } else if (!audio.paused && !heard) {
        if (!silentSince) silentSince = now;
        if (now - silentSince > 250) { // 0.25 san ərzində heç bir səs ölçülmədi -> analiz işləmir
          target = synthLevel(dt);
          bands.fill(target * 0.8);
        }
      }
    } else {
      silentSince = 0;
      heard = false; // növbəti cavab üçün yenidən yoxla
    }
    level += (target - level) * (target > level ? 0.6 : 0.25);
    A.level = level;
    A.bands = bands;
    requestAnimationFrame(analyse);
  }
  requestAnimationFrame(analyse);

  // ---------- Film grain ----------
  const grain = document.getElementById("grain").getContext("2d");
  const gImg = grain.createImageData(180, 320);
  setInterval(() => {
    const d = gImg.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    grain.putImageData(gImg, 0, 0);
  }, 83);

  // Lampa titrəməsi
  const lampEl = document.getElementById("lamp");
  setInterval(() => {
    const t = performance.now() / 1000;
    lampEl.style.opacity = (0.85 + 0.08 * Math.sin(t * 7.3) + 0.05 * Math.sin(t * 13.1) - (Math.random() < 0.02 ? 0.2 : 0)).toFixed(2);
  }, 60);

  // ---------- Şərh və subtitr ----------
  let commentTimer, subtitleTimer, currentId = null, ws, speakResolve = null;

  function showComment(user, text) {
    commentEl.innerHTML = "";
    const b = document.createElement("b");
    b.textContent = user + ": ";
    commentEl.append(b, document.createTextNode(text));
    commentEl.classList.add("show");
    clearTimeout(commentTimer);
    commentTimer = setTimeout(() => commentEl.classList.remove("show"), 6000);
    robot()?.gesture("glance"); // robot şərhə baxır
  }

  function stopTalking() {
    window.robotAudio.speaking = false;
    subtitleTimer = setTimeout(() => subtitleEl.classList.remove("show"), 1200);
    if (currentId && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "speak_done", id: currentId }));
    currentId = null;
    if (speakResolve) { speakResolve(); speakResolve = null; }
  }

  audio.addEventListener("playing", () => { window.robotAudio.speaking = true; });
  audio.addEventListener("ended", stopTalking);
  audio.addEventListener("error", () => { if (currentId) stopTalking(); });

  async function speak(msg) {
    currentId = msg.id;
    clearTimeout(subtitleTimer);
    subtitleEl.textContent = msg.text;
    subtitleEl.classList.add("show");
    if (Math.random() < 0.5) setTimeout(() => robot()?.gesture(Math.random() < 0.6 ? "talk" : "talkL"), 300);
    try {
      if (!(await tryResume())) throw new Error("audio locked");
      audio.src = msg.audio;
      await audio.play();
    } catch (err) {
      unlockEl.classList.add("show");
      stopTalking();
    }
  }

  // Telefonda ekran sönməsin (yayın zamanı)
  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  // İlk toxunuş: səsi aç + ekranı oyaq saxla
  document.addEventListener("pointerdown", () => { initAudio(); actx.resume(); keepAwake(); }, { once: true });

  unlockEl.addEventListener("click", async () => {
    unlockEl.classList.remove("show");
    initAudio();
    await actx.resume();
    if (actx.state !== "running") setTimeout(() => actx.resume(), 300); // bəzən ikinci cəhd lazım olur
  });

  // ---------- Video yazma (Video studiyası) ----------
  // Görüntü (android + şərh + subtitr + effektlər) 1080x1920 kətana çəkilir, səs ilə birlikdə yazılır.
  const REC_W = 1080, REC_H = 1920;
  const recCanvas = document.createElement("canvas");
  recCanvas.width = REC_W; recCanvas.height = REC_H;
  const rctx = recCanvas.getContext("2d");
  let recording = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function recMime() {
    const types = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"];
    return types.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  }

  function wrapLines(ctx, text, maxW) {
    const words = text.split(/\s+/), lines = [];
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  }

  function drawRecFrame(t) {
    const c = rctx;
    c.save();
    c.fillStyle = "#000"; c.fillRect(0, 0, REC_W, REC_H);
    // Kamera "nəfəsi" (səhifədəki drift kimi)
    const sc = 1.03 + 0.003 * Math.sin(t * 0.37);
    c.translate(REC_W / 2 + Math.sin(t * 0.21) * 3, REC_H / 2 + Math.sin(t * 0.17) * 2);
    c.scale(sc, sc);
    c.translate(-REC_W / 2, -REC_H / 2);
    const H = REC_W * 1024 / 572, y0 = (REC_H - H) / 2;
    const room = document.getElementById("room");
    if (!room.hidden) c.drawImage(room, 0, y0, REC_W, H);
    const actionVideo = document.getElementById("action");
    const src = actionVideo.classList.contains("show") ? actionVideo
      : document.querySelector("#android:not([hidden]), #robot3d:not([hidden])");
    if (src) c.drawImage(src, 0, y0, REC_W, H);
    // Lampa işığı
    c.globalCompositeOperation = "screen";
    c.globalAlpha = Number(lampEl.style.opacity || 0.85);
    const lx = REC_W * 0.11, ly = y0 + H * 0.33;
    const lg = c.createRadialGradient(lx, ly, 0, lx, ly, REC_W * 0.18);
    lg.addColorStop(0, "rgba(255,210,150,.35)"); lg.addColorStop(1, "rgba(255,180,90,0)");
    c.fillStyle = lg; c.fillRect(lx - 300, ly - 300, 600, 600);
    c.restore();
    // Vignette
    const vg = c.createRadialGradient(REC_W / 2, REC_H * 0.45, REC_H * 0.3, REC_W / 2, REC_H * 0.45, REC_H * 0.62);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.35)");
    c.fillStyle = vg; c.fillRect(0, 0, REC_W, REC_H);
    // Film grain
    c.save(); c.globalCompositeOperation = "overlay"; c.globalAlpha = 0.07;
    c.imageSmoothingEnabled = false;
    c.drawImage(document.getElementById("grain"), 0, 0, REC_W, REC_H);
    c.restore();
    // Şərh qabarcığı
    if (commentEl.classList.contains("show") && !document.body.classList.contains("acting")) {
      const name = commentEl.querySelector("b")?.textContent || "";
      const text = commentEl.textContent.slice(name.length);
      c.font = "600 44px -apple-system, 'Segoe UI', Roboto, sans-serif";
      const lines = wrapLines(c, name + text, REC_W * 0.92 - 80);
      const bh = 40 + lines.length * 56;
      c.fillStyle = "rgba(0,0,0,.55)"; roundRect(c, REC_W * 0.04, REC_H * 0.06, REC_W * 0.92, bh, 36);
      lines.forEach((ln, i) => {
        const y = REC_H * 0.06 + 64 + i * 56, x = REC_W * 0.04 + 40;
        if (i === 0 && ln.startsWith(name)) {
          c.fillStyle = "#ffd33d"; c.fillText(name, x, y);
          c.fillStyle = "#fff"; c.fillText(ln.slice(name.length), x + c.measureText(name).width, y);
        } else { c.fillStyle = "#fff"; c.fillText(ln, x, y); }
      });
    }
    // Subtitr
    if (subtitleEl.classList.contains("show") && subtitleEl.textContent && !document.body.classList.contains("acting")) {
      c.font = "800 72px -apple-system, 'Segoe UI', Roboto, sans-serif";
      c.textAlign = "center";
      const lines = wrapLines(c, subtitleEl.textContent, REC_W * 0.86);
      const base = REC_H * 0.87 - (lines.length - 1) * 90;
      lines.forEach((ln, i) => {
        c.lineWidth = 10; c.strokeStyle = "rgba(0,0,0,.85)"; c.lineJoin = "round";
        c.strokeText(ln, REC_W / 2, base + i * 90);
        c.fillStyle = "#fff"; c.fillText(ln, REC_W / 2, base + i * 90);
      });
      c.textAlign = "start";
    }
  }

  function recLoop(now) {
    if (!recording) return;
    drawRecFrame(now / 1000);
    requestAnimationFrame(recLoop);
  }

  async function doClip(msg) {
    try {
      if (!(await tryResume())) { unlockEl.classList.add("show"); throw new Error("Səs bloklanıb: robot səhifəsinə bir dəfə klikləyin"); }
      const mime = recMime();
      if (!mime) throw new Error("Brauzer video yazmağı dəstəkləmir");
      recording = true;
      requestAnimationFrame(recLoop);
      const stream = new MediaStream([...recCanvas.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 160_000 });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      const stopped = new Promise((r) => (recorder.onstop = r));
      recorder.start(250);

      await sleep(700);
      showComment(msg.user, msg.question);       // sual ekranda görünür, robot ona baxır
      await sleep(1300);
      const spoken = new Promise((r) => (speakResolve = r));
      await speak(msg);                           // robot cavab verir
      await spoken;
      await sleep(1300);

      recorder.stop();
      await stopped;
      recording = false;
      stream.getTracks().forEach((tr) => tr.stop());
      const blob = new Blob(chunks, { type: mime.split(";")[0] });
      await fetch(`/clip_upload?id=${encodeURIComponent(msg.id)}`, { method: "POST", body: blob, headers: { "Content-Type": blob.type } });
    } catch (err) {
      recording = false;
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "clip_error", id: msg.id, detail: String(err.message || err) }));
    }
  }

  // ---------- Hərəkət videoları (hədiyyə reaksiyaları) ----------
  const actionEl = document.getElementById("action");
  let actionNode = null;

  async function playAction(msg) {
    try {
      initAudio();
      if (!actionNode) { // videonun səsi də yayına və video yazılarına getsin
        actionNode = actx.createMediaElementSource(actionEl);
        actionNode.connect(actx.destination);
        actionNode.connect(recDest);
      }
      const audioOk = await tryResume();
      if (!audioOk) { unlockEl.classList.add("show"); actionEl.muted = true; } // səs kilidlidir: səssiz oynat
      await new Promise((resolve, reject) => {
        actionEl.oncanplay = resolve;
        actionEl.onerror = () => reject(new Error("video yüklənmədi: " + msg.video));
        actionEl.src = msg.video;
        actionEl.load();
      });
      try { await actionEl.play(); } catch (e) { actionEl.muted = true; await actionEl.play(); }
      document.body.classList.add("acting");
      actionEl.classList.add("show");               // foto -> video (ilk kadr fotodur, keçid hiss olunmur)
      const maxMs = ((actionEl.duration || 15) + 3) * 1000;
      await Promise.race([new Promise((r) => (actionEl.onended = r)), new Promise((r) => setTimeout(r, maxMs))]);
    } catch (err) {
      console.warn("Hərəkət videosu:", err);
    }
    actionEl.classList.remove("show");              // video -> foto
    document.body.classList.remove("acting");
    actionEl.muted = false;
    await sleep(200);
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "action_done", id: msg.id }));
  }

  function handle(msg) {
    switch (msg.type) {
      case "action": playAction(msg); break;
      case "clip": doClip(msg); break;
      case "comment": showComment(msg.user, msg.text); break;
      case "speak": speak(msg); break;
      case "speak_end": if (msg.id === currentId) { audio.pause(); stopTalking(); } break;
      case "gesture": robot()?.gesture(msg.name); break;
    }
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => statusEl.classList.add("ok");
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => { statusEl.classList.remove("ok"); setTimeout(connect, 1000); };
  }
  connect();
</script>
</body>
</html>
