<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Robot</title>
<style>
  /* 9:16 şaquli kadr (TikTok). OBS-də 1080x1920 ölçüsü verilir. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* Səhnə: fon şəkli (572x1024 nisbəti) + üstündə 3D robot */
  #stage { position: absolute; left: 50%; top: 50%; aspect-ratio: 572 / 1024;
    width: max(100vw, calc(100vh * 572 / 1024)); transform: translate(-50%, -50%); }
  #camera { position: absolute; inset: 0; animation: drift 17s ease-in-out infinite; }
  #room, #robot3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Ştativdəki telefonun çox yüngül "nəfəs alması" */
  @keyframes drift {
    0%   { transform: scale(1.03) translate(0, 0) rotate(0deg); }
    25%  { transform: scale(1.032) translate(-0.25%, 0.15%) rotate(-0.08deg); }
    50%  { transform: scale(1.03) translate(0.2%, -0.1%) rotate(0.06deg); }
    75%  { transform: scale(1.033) translate(-0.1%, -0.2%) rotate(0deg); }
    100% { transform: scale(1.03) translate(0, 0) rotate(0deg); }
  }

  /* Lampa işığının zəif titrəməsi */
  #lamp { position: absolute; left: -5%; top: 22%; width: 32%; height: 22%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse, rgba(255,210,150,.35), rgba(255,180,90,0) 70%); mix-blend-mode: screen; }

  /* Fincandan qalxan buxar */
  .steam { position: absolute; left: 15.5%; top: 70%; width: 4%; height: 8%; pointer-events: none; }
  .steam i { position: absolute; bottom: 0; left: 20%; width: 60%; height: 40%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.3), rgba(255,255,255,0) 70%);
    filter: blur(3px); opacity: 0; animation: rise 4.5s ease-out infinite; }
  .steam i:nth-child(2) { animation-delay: 1.5s; left: 5%; }
  .steam i:nth-child(3) { animation-delay: 3s; left: 35%; }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    20%  { opacity: .5; }
    100% { transform: translateY(-160%) scale(1.6) translateX(30%); opacity: 0; }
  }

  #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .07; mix-blend-mode: overlay; pointer-events: none; image-rendering: pixelated; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }

  /* İzləyicinin şərhi */
  #comment { position: absolute; left: 4%; right: 4%; top: 6%; padding: 1.8vh 2.6vh; border-radius: 2vh;
    background: rgba(0,0,0,.5); backdrop-filter: blur(6px); color: #fff; font-size: 2.4vh;
    opacity: 0; transform: translateY(-1vh); transition: opacity 200ms, transform 200ms; }
  #comment.show { opacity: 1; transform: none; }
  #comment b { color: #ffd33d; }

  /* Robotun cavabı (subtitr) */
  #subtitle { position: absolute; left: 6%; right: 6%; bottom: 13%; text-align: center; color: #fff;
    font-size: 3.8vh; font-weight: 800; line-height: 1.25;
    text-shadow: 0 0.3vh 0.8vh #000, 0 0 0.3vh #000; opacity: 0; transition: opacity 150ms; }
  #subtitle.show { opacity: 1; }

  /* Adi brauzerdə səs üçün bir dəfə klik lazımdır (OBS-də lazım deyil) */
  #unlock { position: absolute; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6);
    color: #fff; font-size: 3vh; cursor: pointer; }
  #unlock.show { display: grid; }

  #status { position: absolute; right: 8px; bottom: 8px; width: 10px; height: 10px; border-radius: 50%; background: #da3633; }
  #status.ok { background: #2ea043; }
</style>
<script type="importmap">
  { "imports": { "three": "/static/vendor/three.module.min.js", "three/addons/": "/static/vendor/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <div id="camera">
    <img id="room" src="/static/assets/room_bg.jpg" alt="">
    <div id="lamp"></div>
    <div class="steam"><i></i><i></i><i></i></div>
    <canvas id="robot3d"></canvas>
  </div>
  <canvas id="grain" width="180" height="320"></canvas>
  <div id="vignette"></div>
</div>

<div id="comment"></div>
<div id="subtitle"></div>
<div id="unlock">🔊 Səsi aktivləşdirmək üçün klikləyin</div>
<div id="status" title="Serverə qoşulma"></div>

<script type="module">
  import { startRobot } from "/static/robot3d.js";
  startRobot(document.getElementById("robot3d"), document.getElementById("stage"));
</script>

<script>
  const commentEl = document.getElementById("comment");
  const subtitleEl = document.getElementById("subtitle");
  const statusEl = document.getElementById("status");
  const unlockEl = document.getElementById("unlock");
  const robot = () => window.robot; // 3D modul yüklənəndən sonra mövcud olur

  // ---------- Səs + analiz (robotun ağzı və başı bundan istifadə edir) ----------
  const audio = new Audio();
  let actx, analyser, freq;
  window.robotAudio = { level: 0, bands: [], speaking: false };
  const BAND_COUNT = 17;

  function initAudio() {
    if (actx) return;
    actx = new AudioContext();
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.55;
    src.connect(analyser);
    analyser.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
  }

  let level = 0;
  function analyse() {
    const A = window.robotAudio;
    let target = 0;
    const bands = new Array(BAND_COUNT).fill(0);
    if (analyser && A.speaking) {
      analyser.getByteFrequencyData(freq);
      let sum = 0;
      for (let i = 2; i < 48; i++) sum += freq[i]; // danışıq tezlikləri
      target = Math.min(1, (sum / 46) / 150);
      for (let b = 0; b < BAND_COUNT; b++) {
        const center = Math.abs(b - (BAND_COUNT - 1) / 2) / ((BAND_COUNT - 1) / 2);
        bands[b] = Math.min(1, freq[3 + Math.floor(center * 30)] / 210) * (1 - center * 0.45);
      }
    }
    level += (target - level) * (target > level ? 0.6 : 0.25);
    A.level = level;
    A.bands = bands;
    requestAnimationFrame(analyse);
  }
  requestAnimationFrame(analyse);

  // ---------- Film grain ----------
  const grain = document.getElementById("grain").getContext("2d");
  const gImg = grain.createImageData(180, 320);
  setInterval(() => {
    const d = gImg.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    grain.putImageData(gImg, 0, 0);
  }, 83);

  // Lampa titrəməsi
  const lampEl = document.getElementById("lamp");
  setInterval(() => {
    const t = performance.now() / 1000;
    lampEl.style.opacity = (0.85 + 0.08 * Math.sin(t * 7.3) + 0.05 * Math.sin(t * 13.1) - (Math.random() < 0.02 ? 0.2 : 0)).toFixed(2);
  }, 60);

  // ---------- Şərh və subtitr ----------
  let commentTimer, subtitleTimer, currentId = null, ws;

  function showComment(user, text) {
    commentEl.innerHTML = "";
    const b = document.createElement("b");
    b.textContent = user + ": ";
    commentEl.append(b, document.createTextNode(text));
    commentEl.classList.add("show");
    clearTimeout(commentTimer);
    commentTimer = setTimeout(() => commentEl.classList.remove("show"), 6000);
    robot()?.gesture("glance"); // robot şərhə baxır
  }

  function stopTalking() {
    window.robotAudio.speaking = false;
    subtitleTimer = setTimeout(() => subtitleEl.classList.remove("show"), 1200);
    if (currentId && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "speak_done", id: currentId }));
    currentId = null;
  }

  audio.addEventListener("playing", () => { window.robotAudio.speaking = true; });
  audio.addEventListener("ended", stopTalking);
  audio.addEventListener("error", () => { if (currentId) stopTalking(); });

  async function speak(msg) {
    currentId = msg.id;
    clearTimeout(subtitleTimer);
    subtitleEl.textContent = msg.text;
    subtitleEl.classList.add("show");
    if (Math.random() < 0.5) setTimeout(() => robot()?.gesture(Math.random() < 0.6 ? "talk" : "talkL"), 300);
    try {
      initAudio();
      if (actx.state !== "running") await actx.resume();
      if (actx.state !== "running") throw new Error("audio locked");
      audio.src = msg.audio;
      await audio.play();
    } catch (err) {
      unlockEl.classList.add("show");
      stopTalking();
    }
  }

  unlockEl.addEventListener("click", async () => {
    unlockEl.classList.remove("show");
    initAudio();
    await actx.resume();
    if (actx.state !== "running") setTimeout(() => actx.resume(), 300); // bəzən ikinci cəhd lazım olur
  });

  function handle(msg) {
    switch (msg.type) {
      case "comment": showComment(msg.user, msg.text); break;
      case "speak": speak(msg); break;
      case "speak_end": if (msg.id === currentId) { audio.pause(); stopTalking(); } break;
      case "gesture": robot()?.gesture(msg.name); break;
    }
  }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => statusEl.classList.add("ok");
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => { statusEl.classList.remove("ok"); setTimeout(connect, 1000); };
  }
  connect();
</script>
</body>
</html>
