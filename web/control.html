<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Test paneli</title>
<style>
  body { margin: 0; padding: 24px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f8fa; color: #1f2328; }
  .card { max-width: 520px; background: #fff; border: 1px solid #d0d7de; border-radius: 12px; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #59636e; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; border: 1px solid #d0d7de; border-radius: 8px; }
  button { margin-top: 14px; padding: 10px 16px; font-size: 15px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .quick button { margin: 0; background: #eaeef2; color: #1f2328; font-size: 13px; padding: 6px 10px; }
  #log { margin-top: 16px; font-size: 13px; color: #59636e; white-space: pre-line; }
  .card + .card { margin-top: 16px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .row button { margin-top: 0; white-space: nowrap; }
  button.secondary { background: #eaeef2; color: #1f2328; }
  #tt-status { margin-top: 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #tt-dot { width: 10px; height: 10px; border-radius: 50%; background: #8c959f; flex: none; }
  #tt-dot.live { background: #2ea043; } #tt-dot.wait { background: #d4a72c; } #tt-dot.err { background: #da3633; }
</style>
</head>
<body>
<div class="card">
  <h1>TikTok canlı yayını</h1>
  <form id="tt" class="row">
    <input id="tt-user" placeholder="@hesab_adi" autocomplete="off">
    <button type="submit">Qoşul</button>
    <button type="button" id="tt-stop" class="secondary">Dayandır</button>
  </form>
  <div id="tt-status"><span id="tt-dot"></span><span id="tt-text">Qoşulmayıb</span></div>
</div>
<div class="card">
  <h1>Test paneli (saxta şərh)</h1>
  <form id="f">
    <label for="user">İstifadəçi adı</label>
    <input id="user" value="test_user">
    <label for="text">Şərh</label>
    <input id="text" placeholder="Salam robot!" >
    <button type="submit">Göndər</button>
  </form>
  <div class="quick">
    <button data-t="Salam!">Salam!</button>
    <button data-t="Necəsən?">Necəsən?</button>
    <button data-t="Adın nədir?">Adın nədir?</button>
    <button data-t="Haradan gəlmisən?">Haradan gəlmisən?</button>
  </div>
  <div id="log">Qoşulur…</div>
</div>
<script>
  const log = document.getElementById("log");
  let ws;
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => log.textContent = "Serverə qoşuldu ✓";
    ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === "tiktok_status") showTikTok(m); };
    ws.onclose = () => { log.textContent = "Bağlantı kəsildi, yenidən qoşulur…"; setTimeout(connect, 1000); };
  }
  connect();

  function send(text) {
    if (!text || ws.readyState !== 1) return;
    const user = document.getElementById("user").value || "test";
    ws.send(JSON.stringify({ type: "test_comment", user, text }));
    log.textContent = `Göndərildi: ${text}`;
  }
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    send(input.value.trim());
    input.value = "";
  };
  // ---------- TikTok ----------
  const STATES = {
    stopped:    ["", "Qoşulmayıb"],
    connecting: ["wait", "Qoşulur: @{u}…"],
    live:       ["live", "Canlı yayına qoşulub: @{u} — şərhlər gəlir"],
    offline:    ["wait", "@{u} hazırda canlı deyil, gözləyir (30 saniyədən bir yoxlayır)"],
    error:      ["err", "Xəta: {d} (yenidən cəhd edir)"],
  };
  function showTikTok(m) {
    const [cls, text] = STATES[m.state] || ["", m.state];
    document.getElementById("tt-dot").className = cls;
    document.getElementById("tt-text").textContent = text.replace("{u}", m.username).replace("{d}", m.detail);
    if (m.username && !document.getElementById("tt-user").value) document.getElementById("tt-user").value = "@" + m.username;
  }
  document.getElementById("tt").onsubmit = (e) => {
    e.preventDefault();
    const username = document.getElementById("tt-user").value.trim();
    if (username && ws.readyState === 1) ws.send(JSON.stringify({ type: "tiktok_connect", username }));
  };
  document.getElementById("tt-stop").onclick = () => {
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: "tiktok_connect", username: "" }));
  };

  document.querySelectorAll(".quick button").forEach(b => b.onclick = () => send(b.dataset.t));
</script>
</body>
</html>
